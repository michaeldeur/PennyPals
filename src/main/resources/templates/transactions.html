<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Pals - Transactions</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }
        .custom-header, .custom-footer {
            background-color: #87CEEB;
            color: #000000;
            flex-shrink: 0;
        }
        .logo-img {
            height: 45px;
            width: auto;
        }
        .nav-bar-strip {
            background-color: #ffffff;
            border-bottom: 1px solid #71bce0;
            padding: 0.4rem 0;
            flex-shrink: 0;
        }
        .nav-bar-strip a {
            color: #0d6efd;
            text-decoration: underline;
            font-size: 0.95rem;
            padding: 0 1rem;
        }
        .nav-bar-strip a:hover {
            color: #0a58ca;
        }
        .pennies-badge-input {
            width: 130px;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            color: #495057;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.9rem;
        }
        .logout-link {
            color: #0d6efd;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2rem;
        }
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            position: relative;
        }
        .page-title-section {
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 768px) {
            .content-wrapper {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
            }
            .page-title-section {
                position: absolute;
                left: 0;
                top: 0;
                width: auto;
                text-align: left;
                margin-bottom: 0;
            }
        }
        .page-title {
            font-weight: 500;
            font-size: 1.8rem;
            color: #000000;
        }
        .transactions-card {
            border: 1px solid #ced4da;
            border-radius: 12px;
            padding: 2rem;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            width: 100%;
            max-width: 750px;
        }
        .table > :not(caption) > * > * {
            padding: 0.75rem 0.5rem;
        }
    </style>
</head>
<body>

<!-- Header Section -->
<header class="custom-header py-3 px-4 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.svg}" src="../static/images/logo.svg" alt="Penny Pals Logo" class="logo-img me-3">
            <h1 class="h3 mb-0 fw-bold">Penny Pals</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
            <input type="text" class="pennies-badge-input" readonly
                   th:value="${profile != null ? profile.pennies + ' Pennies' : 'XXXX Pennies'}"
                   value="XXXX Pennies">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="logout-link">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Navigation Bar Strip -->
<nav class="nav-bar-strip">
    <div class="container-fluid d-flex justify-content-around align-items-center flex-wrap">
        <a th:href="@{/aquarium}">Aquarium</a>
        <a th:href="@{/shop}">Shop</a>
        <a th:href="@{/quests}">Quests</a>
        <a th:href="@{/budget}">Budget</a>
        <a th:href="@{/transactions}">Transactions</a>
        <a th:href="@{/add-transaction}">Add Transaction</a>
    </div>
</nav>

<!-- Main Content Area -->
<main class="main-container">
    <div class="content-wrapper">
        <div class="page-title-section">
            <h2 class="page-title"></h2>
        </div>

        <div class="transactions-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-normal text-success mb-0">Recent Activity (Last 5)</h4>
                <a th:href="@{/add-transaction}" class="btn btn-success btn-sm">+ Add New</a>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(transactions)}" class="text-center py-4 text-muted">
                <p class="mb-0">No transactions recorded yet.</p>
            </div>

            <!-- Recent Transactions Table -->
            <div th:if="${!#lists.isEmpty(transactions)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Notes</th>
                        <th class="text-end">Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td class="small" th:text="${tx.date != null ? #temporals.format(tx.date, 'yyyy-MM-dd') : 'N/A'}">2026-10-01</td>
                        <td class="fw-medium" th:text="${tx.category}">Food</td>
                        <td>
                                <span class="badge"
                                      th:classappend="${tx.type == 'INCOME' ? 'bg-success-subtle text-success border border-success' : 'bg-danger-subtle text-danger border border-danger'}"
                                      th:text="${tx.type}">EXPENSE</span>
                        </td>
                        <td class="text-muted small" th:text="${tx.notes != null && !tx.notes.isBlank() ? tx.notes : '-'}">Grocery run</td>
                        <td class="text-end fw-bold"
                            th:classappend="${tx.type == 'INCOME' ? 'text-success' : 'text-dark'}"
                            th:text="${(tx.type == 'INCOME' ? '+' : '-') + '$' + #numbers.formatDecimal(tx.amount, 1, 2)}">-$45.50</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Footer Section -->
<footer class="custom-header text-center py-3">
    <p class="mb-0 text-dark">&copy; 2026 Penny Pals</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
