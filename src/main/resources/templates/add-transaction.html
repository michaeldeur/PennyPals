<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Pals - Add Transaction</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }
        .custom-header, .custom-footer {
            background-color: #87CEEB;
            color: #000000;
            flex-shrink: 0;
        }
        .logo-img {
            height: 45px;
            width: auto;
        }
        .nav-bar-strip {
            background-color: #ffffff;
            border-bottom: 1px solid #71bce0;
            padding: 0.4rem 0;
            flex-shrink: 0;
        }
        .nav-bar-strip a {
            color: #0d6efd;
            text-decoration: underline;
            font-size: 0.95rem;
            padding: 0 1rem;
        }
        .nav-bar-strip a:hover {
            color: #0a58ca;
        }
        .pennies-badge-input {
            width: 130px;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            color: #495057;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.9rem;
        }
        .logout-link {
            color: #0d6efd;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2rem;
        }
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            position: relative;
        }
        .page-title-section {
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 1000px) {
            .page-title-section {
                position: absolute;
                left: 0;
                top: 0;
                width: auto;
                text-align: left;
                margin-bottom: 0;
            }
        }
        .page-title {
            font-weight: 500;
            font-size: 1.8rem;
            color: #000000;
        }
        .transaction-card {
            border: 1px solid #ced4da;
            border-radius: 12px;
            padding: 2.5rem;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            width: 100%;
            max-width: 440px;
        }
        .btn-add {
            background-color: #87CEEB;
            border: 1px solid #6cb4d4;
            color: #000000;
            font-weight: 500;
            width: 100%;
        }
        .btn-add:hover {
            background-color: #71bce0;
            color: #000000;
        }

        /* Mobile Responsiveness for Header & Nav */
        @media (max-width: 768px) {
            .custom-header .container-fluid {
                flex-direction: column;
                gap: 0.75rem;
                text-align: center;
            }
            .custom-header .d-flex.align-items-center {
                justify-content: center;
            }
            .nav-bar-strip .container-fluid {
                justify-content: center !important;
                gap: 0.25rem 0.5rem;
            }
            .nav-bar-strip a {
                padding: 0.25rem 0.5rem;
                font-size: 0.85rem;
            }
            .transactions-card {
                padding: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Header Section -->
<header class="custom-header py-3 px-4 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.svg}" src="../static/images/logo.svg" alt="Penny Pals Logo" class="logo-img me-3">
            <h1 class="h3 mb-0 fw-bold">Penny Pals</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
            <input type="text" class="pennies-badge-input" readonly
                   th:value="${profile != null ? profile.pennies + ' Pennies' : 'XXXX Pennies'}"
                   value="XXXX Pennies">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="logout-link">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Navigation Bar Strip -->
<nav class="nav-bar-strip">
    <div class="container-fluid d-flex justify-content-around align-items-center flex-wrap">
        <a th:href="@{/aquarium}">Aquarium</a>
        <a th:href="@{/shop}">Shop</a>
        <a th:href="@{/quests}">Quests</a>
        <a th:href="@{/budget}">Budget</a>
        <a th:href="@{/transactions}">Transactions</a>
        <a th:href="@{/add-transaction}">Add Transaction</a>
    </div>
</nav>

<!-- Main Content Area -->
<main class="main-container">
    <div class="content-wrapper">
        <div class="page-title-section">
            <h2 class="page-title">Add Transaction</h2>
        </div>

        <div class="transaction-card">
            <h4 class="mb-4 fw-normal text-dark">Transaction</h4>

            <form th:action="@{/add-transaction}" th:object="${transaction}" method="post">

                <!-- Category Dropdown -->
                <div class="mb-3">
                    <label class="form-label small text-muted mb-1">Category</label>
                    <select class="form-select" th:field="*{category}" required>
                        <option value="" disabled selected>Select</option>
                        <option value="Income">Income</option>
                        <option value="Giving">Giving</option>
                        <option value="Savings">Savings</option>
                        <option value="Housing">Housing</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Food">Food</option>
                        <option value="Personal">Personal</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Health">Health</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Non-mortgage Debts">Non-mortgage Debts</option>
                    </select>
                </div>

                <!-- Amount Input -->
                <div class="mb-4">
                    <label class="form-label small text-muted mb-1">Amount</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">$</span>
                        <input type="number" step="0.01" class="form-control" th:field="*{amount}" placeholder="0.00" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-add py-2">Add (+10 Pennies)</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer Section -->
<footer class="custom-header text-center py-3">
    <p class="mb-0 text-dark">&copy; 2026 Penny Pals</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
