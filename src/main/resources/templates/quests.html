<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Pals - Quests</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #ffffff; /* Soft aquarium water background */
        }
        .custom-header, .custom-footer {
            background-color: #87CEEB;
            color: #000000;
            flex-shrink: 0;
        }
        .logo-img {
            height: 45px;
            width: auto;
        }
        /* Top Navigation Bar Strip */
        .nav-bar-strip {
            background-color: #ffffff;
            border-bottom: 1px solid #71bce0;
            padding: 0.4rem 0;
            flex-shrink: 0;
        }
        .nav-bar-strip a {
            color: #0d6efd;
            text-decoration: underline;
            font-size: 0.95rem;
            padding: 0 1rem;
        }
        .nav-bar-strip a:hover {
            color: #0a58ca;
        }
        .pennies-badge-input {
            width: 130px;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            color: #495057;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.9rem;
        }
        .logout-link {
            color: #0d6efd;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2rem;
        }

        /* Flex wrapper to align title to the left of the centered card on desktop */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        .page-title-section {
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .content-wrapper {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
            }
            .page-title-section {
                position: absolute;
                left: 0;
                top: 0;
                width: auto;
                text-align: left;
                margin-bottom: 0;
            }
        }

        .page-title {
            font-weight: 500;
            font-size: 1.8rem;
            color: #000000;
        }

        .quests-card {
            border: 1px solid #ced4da;
            border-radius: 12px;
            padding: 2.5rem;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        /* Mobile Responsiveness for Header & Nav */
        @media (max-width: 768px) {
            .custom-header .container-fluid {
                flex-direction: column;
                gap: 0.75rem;
                text-align: center;
            }
            .custom-header .d-flex.align-items-center {
                justify-content: center;
            }
            .nav-bar-strip .container-fluid {
                justify-content: center !important;
                gap: 0.25rem 0.5rem;
            }
            .nav-bar-strip a {
                padding: 0.25rem 0.5rem;
                font-size: 0.85rem;
            }
            .transactions-card {
                padding: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Header Section -->
<header class="custom-header py-3 px-4 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img th:src="@{/images/logo.svg}" src="../static/images/logo.svg" alt="Penny Pals Logo" class="logo-img me-3">
            <h1 class="h3 mb-0 fw-bold">Penny Pals</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
            <input type="text" class="pennies-badge-input" readonly
                   th:value="${profile != null ? profile.pennies + ' Pennies' : 'XXXX Pennies'}"
                   value="XXXX Pennies">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="logout-link">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Navigation Bar Strip -->
<nav class="nav-bar-strip">
    <div class="container-fluid d-flex justify-content-around align-items-center flex-wrap">
        <a th:href="@{/aquarium}">Aquarium</a>
        <a th:href="@{/shop}">Shop</a>
        <a th:href="@{/quests}">Quests</a>
        <a th:href="@{/budget}">Budget</a>
        <a th:href="@{/transactions}">Transactions</a>
        <a th:href="@{/add-transaction}">Add Transaction</a>
    </div>
</nav>

<!-- Main Content Area -->
<main class="main-container">
    <div class="content-wrapper">
        <!-- Top-left aligned header matching project design standards -->
        <div class="page-title-section">
            <h2 class="page-title"></h2>
        </div>

        <!-- Centered Quests Card -->
        <div class="quests-card">
            <h3 class="text-success mb-2">Daily Quests & Habit Goals</h3>
            <p class="text-muted small mb-0">Interactive checklist and penny reward claim actions will be built in Checkpoint 6.</p>
        </div>
    </div>
</main>

<!-- Footer Section -->
<footer class="custom-header text-center py-3">
    <p class="mb-0 text-dark">&copy; 2026 Penny Pals</p>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
