server.port=8080

# File-Based H2 Datasource Configuration (Production file mode)
spring.datasource.url=jdbc:h2:file:./data/pennypalsdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console disabled for security in production environments
spring.h2.console.enabled=false

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable embedded SQL script re-execution on application restarts
spring.sql.init.mode=never